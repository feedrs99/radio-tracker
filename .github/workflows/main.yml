name: Radio Tracker Automatico

on:
  schedule:
    # Esegui ogni 10 minuti
    - cron: '*/10 * * * *'
  # Permette di avviarlo manualmente
  workflow_dispatch:

jobs:
  esegui-script:
    runs-on: ubuntu-latest
    steps:
      - name: Recupera il codice
        uses: actions/checkout@v3

      - name: Prepara Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa le librerie
        run: pip install requests beautifulsoup4

      - name: Avvia l'estrazione
        run: python salva_db.py
